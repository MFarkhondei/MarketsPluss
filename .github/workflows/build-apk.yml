name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Vazir fonts in assets/fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          if [ ! -f app/src/main/assets/fonts/vazirmatn_regular.ttf ]; then
            curl -sL -o app/src/main/assets/fonts/vazirmatn_regular.ttf \
              "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf"
          fi
          if [ ! -f app/src/main/assets/fonts/vazirmatn_bold.ttf ]; then
            curl -sL -o app/src/main/assets/fonts/vazirmatn_bold.ttf \
              "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf"
          fi
          ls -lh app/src/main/assets/fonts/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketpluss-widget-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### APK آماده شد" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY"
